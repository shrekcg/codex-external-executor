<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Codex External Executor</title>
  <desc id="desc">A local protocol bridge that routes one Codex child agent to official APIs or third-party relays.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061524"/><stop offset="1" stop-color="#0B2940"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#38E3D3"/><stop offset="1" stop-color="#77A9FF"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <g opacity=".11" stroke="#9ACFFF"><path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200M100 0V420M200 0V420M300 0V420M400 0V420M500 0V420M600 0V420M700 0V420M800 0V420M900 0V420M1000 0V420M1100 0V420"/></g>
  <circle cx="890" cy="80" r="190" fill="#0D6E9D" opacity=".14"/>
  <text x="65" y="112" fill="#F2F8FF" font-family="Arial, sans-serif" font-size="46" font-weight="700">Codex External Executor</text>
  <text x="68" y="151" fill="#B8CCE0" font-family="Arial, sans-serif" font-size="19">Route one native Codex child task to any compatible external model API.</text>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <rect x="68" y="208" width="182" height="58" rx="12" fill="#123756" stroke="#5FA7D8"/><text x="94" y="243" fill="#EDF8FF">MAIN CODEX</text>
    <rect x="301" y="208" width="184" height="58" rx="12" fill="#123756" stroke="#5FA7D8"/><text x="329" y="243" fill="#EDF8FF">CHILD AGENT</text>
    <rect x="536" y="196" width="184" height="82" rx="14" fill="#0E4B5D" stroke="#38E3D3" stroke-width="2" filter="url(#glow)"/><text x="575" y="232" fill="#DFFFFA">LOOPBACK</text><text x="586" y="254" fill="#DFFFFA">GATEWAY</text>
    <rect x="837" y="107" width="280" height="54" rx="12" fill="#173B50" stroke="#77A9FF"/><text x="872" y="140" fill="#EAF3FF">OFFICIAL API</text>
    <rect x="837" y="202" width="280" height="54" rx="12" fill="#173B50" stroke="#77A9FF"/><text x="872" y="235" fill="#EAF3FF">THIRD-PARTY RELAY</text>
    <rect x="837" y="297" width="280" height="54" rx="12" fill="#173B50" stroke="#77A9FF"/><text x="872" y="330" fill="#EAF3FF">SELF-HOSTED API</text>
  </g>
  <g fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round"><path d="M251 237H300"/><path d="M486 237H535"/><path d="M721 237H786Q810 237 810 134H836"/><path d="M721 237H836"/><path d="M721 237H786Q810 237 810 324H836"/></g>
  <g fill="#38E3D3"><circle cx="275" cy="237" r="4"/><circle cx="510" cy="237" r="4"/><circle cx="786" cy="237" r="4"/></g>
  <g font-family="Arial, sans-serif" font-size="14"><text x="68" y="326" fill="#7EE5D8">No global model switch</text><text x="68" y="352" fill="#A8BED3">Codex keeps control · Provider handles selected execution</text></g>
</svg>
