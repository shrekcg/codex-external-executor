<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Codex External Executor</title>
  <desc id="desc">主 Codex 对话保持原模型，指定子任务经本机协议网关路由到官方 API、第三方中转或自建 API。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061524"/><stop offset="1" stop-color="#0B2940"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#38E3D3"/><stop offset="1" stop-color="#77A9FF"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <path d="M62 70H1138" stroke="#8FA3C8" stroke-opacity=".22"/>
  <circle cx="1045" cy="92" r="132" fill="#0D6E9D" opacity=".16"/>
  <g id="title-block" transform="translate(62 52)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="0" y="0" fill="#82E5DA" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.8">EXTERNAL ROUTING FOR CODEX SUBAGENTS</text>
    <text x="0" y="76" fill="#F5FAFF" font-size="51" font-weight="760">Codex External</text>
    <text x="0" y="133" fill="#B9CBE0" font-size="34" font-weight="640">Executor</text>
    <text x="0" y="190" fill="#D4E1EE" font-size="21">指定子任务走外部 API，主对话无需切换模型</text>
    <g transform="translate(0 234)" font-size="15" font-weight="650">
      <rect width="150" height="40" rx="20" fill="#102E49" stroke="#37678B"/><circle cx="22" cy="20" r="5" fill="#42D392"/><text x="37" y="26" fill="#E2F8F5">主模型保留</text>
      <rect x="162" width="152" height="40" rx="20" fill="#102E49" stroke="#37678B"/><text x="190" y="26" fill="#E2F8F5">按 route 委派</text>
      <rect x="326" width="140" height="40" rx="20" fill="#102E49" stroke="#37678B"/><text x="353" y="26" fill="#E2F8F5">主 Agent 验收</text>
    </g>
  </g>
  <g id="route-proof" transform="translate(694 82)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect width="442" height="254" rx="22" fill="#091B2C" stroke="#315778"/>
    <text x="30" y="38" fill="#90ABC4" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">VERIFIED ROUTE SHAPE</text>
    <rect x="30" y="60" width="128" height="53" rx="12" fill="#123756" stroke="#46769B"/><text x="54" y="92" fill="#F4FAFF" font-size="16" font-weight="700">主 Codex</text>
    <path d="M170 86H213" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/><path d="M203 77L215 86L203 95" fill="none" stroke="#77A9FF" stroke-width="4" stroke-linecap="round"/>
    <rect x="225" y="60" width="187" height="53" rx="12" fill="#0D4A58" stroke="#38E3D3"/><text x="255" y="92" fill="#E7FFFB" font-size="16" font-weight="700">原生子 Agent</text>
    <path d="M94 137V161H222" stroke="#47789E" stroke-width="3" stroke-linecap="round"/><path d="M212 152L224 161L212 170" fill="none" stroke="#77A9FF" stroke-width="3" stroke-linecap="round"/>
    <rect x="225" y="136" width="187" height="53" rx="12" fill="#0D4A58" stroke="#38E3D3"/><text x="252" y="159" fill="#E7FFFB" font-size="15" font-weight="700">127.0.0.1 网关</text><text x="258" y="177" fill="#9CDBD4" font-size="12">协议适配与凭据隔离</text>
    <path d="M318 191V207" stroke="#47789E" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(30 207)" font-size="13" font-weight="650"><rect width="112" height="30" rx="15" fill="#172E47"/><text x="24" y="20" fill="#D7E7FA">Responses</text><rect x="126" width="104" height="30" rx="15" fill="#172E47"/><text x="152" y="20" fill="#D7E7FA">Chat</text><rect x="242" width="112" height="30" rx="15" fill="#172E47"/><text x="260" y="20" fill="#D7E7FA">Messages</text></g>
  </g>
</svg>
