<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Three-plane architecture</title>
  <desc id="desc">Codex control plane delegates a selected native child agent through a local adapter plane to external provider APIs.</desc>
  <rect width="1200" height="560" rx="24" fill="#071827"/>
  <g font-family="Arial, sans-serif"><text x="58" y="66" fill="#F4F8FF" font-size="30" font-weight="700">One task. Three planes. Clear trust boundaries.</text><text x="58" y="98" fill="#ABC1D5" font-size="17">The parent stays in Codex; only the selected child route crosses an API boundary.</text></g>
  <g font-family="Arial, sans-serif">
    <rect x="58" y="144" width="300" height="340" rx="18" fill="#0C2A43" stroke="#2E86B8"/><text x="86" y="184" fill="#78CFFF" font-size="14" font-weight="700">01 · CONTROL PLANE</text><rect x="84" y="214" width="246" height="62" rx="10" fill="#123B59"/><text x="108" y="251" fill="#EFF8FF" font-size="18" font-weight="700">Main Codex Agent</text><rect x="84" y="310" width="246" height="62" rx="10" fill="#123B59"/><text x="103" y="347" fill="#EFF8FF" font-size="18" font-weight="700">Native child profile</text><text x="86" y="424" fill="#A8BED3" font-size="14">Permissions · workspace · verification</text>
    <rect x="450" y="144" width="300" height="340" rx="18" fill="#093C46" stroke="#36D9CE"/><text x="478" y="184" fill="#74F0E3" font-size="14" font-weight="700">02 · ADAPTER PLANE</text><rect x="476" y="214" width="246" height="62" rx="10" fill="#0D555B"/><text x="522" y="251" fill="#E8FFFB" font-size="18" font-weight="700">Loopback gateway</text><rect x="476" y="310" width="246" height="62" rx="10" fill="#0D555B"/><text x="506" y="347" fill="#E8FFFB" font-size="18" font-weight="700">Protocol adapters</text><text x="478" y="424" fill="#A7D9D4" font-size="14">Responses · Chat · Messages</text>
    <rect x="842" y="144" width="300" height="340" rx="18" fill="#142C4B" stroke="#7CA6FF"/><text x="870" y="184" fill="#AFC7FF" font-size="14" font-weight="700">03 · PROVIDER PLANE</text><rect x="868" y="214" width="246" height="62" rx="10" fill="#1D4166"/><text x="924" y="251" fill="#EEF4FF" font-size="18" font-weight="700">Official APIs</text><rect x="868" y="310" width="246" height="62" rx="10" fill="#1D4166"/><text x="906" y="347" fill="#EEF4FF" font-size="18" font-weight="700">Relays / self-hosted</text><text x="870" y="424" fill="#BDCAEA" font-size="14">Provider billing · privacy · cache</text>
  </g>
  <g fill="none" stroke="#56DCD4" stroke-width="3" stroke-linecap="round"><path d="M359 341H449"/><path d="M751 341H841"/></g><g fill="#56DCD4"><path d="M438 333l12 8-12 8z"/><path d="M830 333l12 8-12 8z"/></g>
  <g font-family="Arial, sans-serif" font-size="14"><text x="76" y="524" fill="#78CFFF">No external route selected? The original Codex workflow is unchanged.</text></g>
</svg>
