<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">三层架构</title>
  <desc id="desc">Codex 控制层把选中的原生子 Agent 通过本机适配层路由到外部 Provider API。</desc>
  <rect width="1200" height="560" rx="24" fill="#071827"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="58" y="66" fill="#F4F8FF" font-size="30" font-weight="700">一个任务，三层边界</text><text x="58" y="98" fill="#ABC1D5" font-size="17">主 Agent 留在 Codex，只有选中的子任务跨过 API 边界。</text></g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="58" y="144" width="300" height="340" rx="18" fill="#0C2A43" stroke="#2E86B8"/><text x="86" y="184" fill="#78CFFF" font-size="14" font-weight="700">01 · 控制层</text><rect x="84" y="214" width="246" height="62" rx="10" fill="#123B59"/><text x="126" y="251" fill="#EFF8FF" font-size="18" font-weight="700">主 Codex Agent</text><rect x="84" y="310" width="246" height="62" rx="10" fill="#123B59"/><text x="123" y="347" fill="#EFF8FF" font-size="18" font-weight="700">原生子 Agent</text><text x="86" y="424" fill="#A8BED3" font-size="14">权限 · 工作区 · 验证</text>
    <rect x="450" y="144" width="300" height="340" rx="18" fill="#093C46" stroke="#36D9CE"/><text x="478" y="184" fill="#74F0E3" font-size="14" font-weight="700">02 · 适配层</text><rect x="476" y="214" width="246" height="62" rx="10" fill="#0D555B"/><text x="536" y="251" fill="#E8FFFB" font-size="18" font-weight="700">本机回环网关</text><rect x="476" y="310" width="246" height="62" rx="10" fill="#0D555B"/><text x="526" y="347" fill="#E8FFFB" font-size="18" font-weight="700">协议适配器</text><text x="478" y="424" fill="#A7D9D4" font-size="14">Responses · Chat · Messages</text>
    <rect x="842" y="144" width="300" height="340" rx="18" fill="#142C4B" stroke="#7CA6FF"/><text x="870" y="184" fill="#AFC7FF" font-size="14" font-weight="700">03 · Provider 层</text><rect x="868" y="214" width="246" height="62" rx="10" fill="#1D4166"/><text x="945" y="251" fill="#EEF4FF" font-size="18" font-weight="700">官方 API</text><rect x="868" y="310" width="246" height="62" rx="10" fill="#1D4166"/><text x="925" y="347" fill="#EEF4FF" font-size="18" font-weight="700">中转 / 自建</text><text x="870" y="424" fill="#BDCAEA" font-size="14">计费 · 隐私 · 缓存</text>
  </g>
  <g fill="none" stroke="#56DCD4" stroke-width="3" stroke-linecap="round"><path d="M359 341H449"/><path d="M751 341H841"/></g><g fill="#56DCD4"><path d="M438 333l12 8-12 8z"/><path d="M830 333l12 8-12 8z"/></g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14"><text x="76" y="524" fill="#78CFFF">未指定外部 route 时，原有 Codex 工作流保持不变。</text></g>
</svg>
